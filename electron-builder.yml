appId: app.ritim.desktop
productName: Ritim
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: resources
    to: resources

linux:
  # AppImage runs on most distributions; deb for Debian/Ubuntu, rpm for Fedora/openSUSE.
  target: [AppImage, deb, rpm]
  category: Utility
  icon: resources/icons
  executableName: ritim
  synopsis: Weekly routine planner with reminders
  # Required for .deb/.rpm packages; a GitHub noreply address keeps personal email out of the package.
  maintainer: Emre <emreygc7@users.noreply.github.com>
  syncDesktopName: true
deb:
  depends: [libnotify4]
rpm:
  depends: [libnotify]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
nsis:
  # Per-user install without admin rights, with Start menu and desktop shortcuts.
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  # No Apple Developer certificate: ad-hoc signing lets the app launch on Apple Silicon.
  # Hardened runtime would reject Electron's pre-signed frameworks under an ad-hoc identity.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: emreygc7
  repo: ritim
  # Publish right away: the in-app update check reads releases/latest, which ignores drafts.
  releaseType: release
