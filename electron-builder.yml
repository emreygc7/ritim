appId: app.ritim.desktop
productName: Ritim
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: resources
    to: resources
linux:
  target: [AppImage, deb]
  category: Utility
  icon: resources/icons
  executableName: ritim
  synopsis: Weekly routine planner with reminders
  # Required for .deb packages; a GitHub noreply address keeps personal email out of the package.
  maintainer: Emre <emreygc7@users.noreply.github.com>
  syncDesktopName: true
deb:
  depends: [libnotify4]
publish:
  provider: github
  owner: emreygc7
  repo: ritim
  # Publish right away: the in-app update check reads releases/latest, which ignores drafts.
  releaseType: release
